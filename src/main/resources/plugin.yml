
name: VoidPortal
version: 1.1.0
main: me.voidportal.VoidPortal
api-version: '1.21'
author: AimVortex
description: Custom animated portals with magical effects and selection tools

commands:
  portal:
    description: Manage VoidPortal portals
    usage: /portal <create|link|remove|size|innersize|setdestination|list|reload>
    aliases:
      - vportal

permissions:
  voidportal.admin:
    description: Allows managing VoidPortal portals and portal selectors
    default: op
    
