
name: VoidPortal
version: 1.0.0
main: me.voidportal.VoidPortal
api-version: '1.21'
author: AimVortex
description: Animated purple portal plugin for Paper

commands:
  portal:
    description: Manage VoidPortal portals
    usage: /portal <create|remove|setdestination|list|reload>
    aliases:
      - vportal

permissions:
  voidportal.admin:
    description: Allows managing VoidPortal portals
    default: op
    
