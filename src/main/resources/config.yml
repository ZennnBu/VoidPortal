
# VoidPortal Configuration
# Author: AimVortex

settings:
  # Enable or disable portal particles
  particle-effect: true

  # Enable or disable portal sounds
  sound-effect: true

  # Portal animation duration in seconds
  animation-duration: 5

  # Teleport countdown duration in seconds
  teleport-delay: 3

  # Cancel teleport countdown if player moves
  cancel-on-move: true

portal:
  # Portal ring radius
  radius: 2.0

  # Number of particles used in the portal effect
  particle-count: 50

  # Particle animation speed
  particle-speed: 0.15

  # Default portal particle color (purple)
  red: 170
  green: 0
  blue: 255

messages:
  prefix: "&5&lVoidPortal &8» &r"

  no-permission: "&cYou don't have permission!"
  player-only: "&cOnly players can use this command!"

  portal-created: "&aPortal created successfully!"
  portal-removed: "&cPortal removed successfully!"
  destination-set: "&aPortal destination set!"

  teleport-start: "&dTeleporting in &f3 &dseconds..."
  teleport-success: "&aYou have been teleported!"
  teleport-cancelled: "&cTeleport cancelled because you moved!"

  portal-not-found: "&cPortal not found!"
